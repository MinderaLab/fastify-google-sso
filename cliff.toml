# git-cliff configuration: writes the release notes. Adapted from MinderaLab/sitemap.
#
# Unlike sitemap, the version comes from package.json, not from git-cliff: apps install
# this package by tag, and npm reports package.json's version, so the two must agree.
# release.yml tags whatever version package.json on the released commit has.
#
#   uvx git-cliff==2.14.2 --unreleased --tag v1.6.0 --strip header  # release notes
#
# No commit message convention: the notes list the subject of every commit merged since
# the last final tag. See README.md, "Releasing".

[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = false
split_commits = false
# The notes list each commit's subject. Merge commits are left out: the commits they bring
# in are listed themselves.
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = ".*", group = "Changes" },
]
filter_commits = false
# Only final tags count as releases: vX.Y.Z-rc.N tags are ignored, so the notes of every
# rc of a release run from the last final tag.
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
